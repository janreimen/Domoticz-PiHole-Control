name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (a fake Pi-hole on a real HTTP/TLS server; openssl makes the test certificates)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 vermin
      - name: pyflakes checks (Domoticz injects Parameters, Devices, Images)
        run: python -m flake8 --select=F --builtins=Parameters,Devices,Images plugin.py pihole_control tests tools
      - name: shellcheck
        run: shellcheck deploy.sh
      - name: Code must stay Python 3.7 compatible (Domoticz hosts run old Pythons)
        run: vermin --target=3.7- --no-tips --violations -q plugin.py pihole_control
      - name: docs/DEVICES.md is up to date
        run: python tools/gen_device_catalog.py --check
